[package]
name = "es-app"
description = "easyscript desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The command line is `easyscript`; the app, beside it on a PATH, `easyscript-app`.
[[bin]]
name = "easyscript-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
es-core.workspace = true
es-formats.workspace = true
es-github.workspace = true
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
keyring = "4.2.0"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
hound = "3"
symphonia = { version = "0.5", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mp3", "ogg", "vorbis", "wav", "pcm", "aiff", "caf", "adpcm"] }
ureq = "3.4.2"

[lints]
workspace = true

[dev-dependencies]
git2 = { version = "0.21.0", features = ["vendored-libgit2"] }
tauri = { version = "2.12.4", features = ["test"] }
tempfile = "3.27.0"
